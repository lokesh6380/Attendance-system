<app-navbar class="navbar"></app-navbar>

<div class="register-container">

  <!-- LEFT -->
  <div class="register-left">
    <img src="assets/register-karate.png" alt="Register">
  </div>

  <!-- RIGHT -->
  <div class="register-right">

    <div class="glass-card">

      <h2>Create Account 🥋</h2>
      <p>Join Karate Management System</p>

      <form #form="ngForm">

        <!-- NAME -->
        <div class="row">
          <div class="input-group">
            <input type="text" [(ngModel)]="firstName" name="firstName" required placeholder=" ">
            <label>First Name</label>
          </div>

          <div class="input-group">
            <input type="text" [(ngModel)]="lastName" name="lastName" required placeholder=" ">
            <label>Last Name</label>
          </div>
        </div>

        <!-- MOBILE -->
        <div class="input-group">
          <input type="tel" [(ngModel)]="mobile" name="mobile" required placeholder=" ">
          <label>Mobile</label>
        </div>

        <!-- EMAIL -->
        <div class="input-group">
          <input type="email" [(ngModel)]="email" name="email" required placeholder=" ">
          <label>Email</label>
        </div>

        <!-- ROLE -->
        <div class="input-group">
          <select [(ngModel)]="role" name="role" required>
            <option value="" disabled selected hidden></option>
            <option value="Instructor">Instructor</option>
            <option value="Sub Master">Sub Master</option>
            <option value="Student">Student</option>
          </select>
          <label>Role</label>
        </div>

        <!-- PLACE -->
        <div class="input-group">
          <select [(ngModel)]="place" name="place" required>
            <option value="" disabled selected hidden></option>
            <option value="New York">New York</option>
            <option value="Los Angeles">Los Angeles</option>
            <option value="Chicago">Chicago</option>
            <option value="Houston">Houston</option>
            <option value="Phoenix">Phoenix</option>
          </select>
          <label>Place</label>
        </div>
        <div class="input-group password-group">
          <input [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="password"
                 name="password"
                 required placeholder=" ">
          <label>Password</label>
          <button type="button" class="eye-icon" (click)="togglePassword()">👁</button>
        </div>

        <!-- CONFIRM -->
        <div class="input-group password-group">
          <input [type]="showConfirm ? 'text' : 'password'"
                 [(ngModel)]="confirmPassword"
                 name="confirmPassword"
                 required placeholder=" ">
          <label>Confirm Password</label>
          <button type="button" class="eye-icon" (click)="toggleConfirm()">👁</button>
        </div>

        <!-- BUTTON -->
        <button type="submit"
                class="register-btn"
                [disabled]="form.invalid || !isFormValid()"
                (click)="onRegister()">
          Register
        </button>

      </form>

      <p class="login-text">
        Already a user?
        <span (click)="goToLogin()">Login</span>
      </p>

    </div>

  </div>

</div>
